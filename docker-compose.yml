# PostgreSQL for the central server.
#   docker compose up -d
# then start the server with:  --spring.profiles.active=postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: netmonitor
      POSTGRES_USER: netmonitor
      POSTGRES_PASSWORD: netmonitor
    ports:
      - "5432:5432"
    volumes:
      - netmonitor-db:/var/lib/postgresql/data

volumes:
  netmonitor-db:
