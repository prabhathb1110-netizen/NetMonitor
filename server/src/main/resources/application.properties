# ---- Web (REST API + WebSocket for the dashboard) ----
server.port=8080

# ---- Agent listener (TCP socket the agents connect to) ----
netmonitor.agent.port=9090
# Shared secret every agent must send when it registers. Change it.
netmonitor.agent.token=change-me

# ---- Monitoring ----
# Sent to every agent; allowed range in the proposal is 10 to 300 seconds.
netmonitor.poll-interval-seconds=30
# Raw measurements older than this are deleted once a day.
netmonitor.retention-days=30

# ---- Database: H2 file database by default (no installation needed) ----
# For PostgreSQL run with:  --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:file:./data/netmonitor
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Show validation messages (for example "host must be an IP address") in API error responses.
server.error.include-message=always
